# ==============================================================================
# SOUSS AGRI-PACK SARL — AUTHORITATIVE NUMBERED BUSINESS EVENT CATALOG
# Comprehensive Multi-Cycle Event Topology across 8 Enterprise Categories
# Standard: Plan Comptable Marocain (PCM), CGI 2025/2026, Dahir CNSS 1972, BAM
# ==============================================================================

metadata:
  catalog_name: "Souss Agri-Pack SARL Business Events Catalog"
  company: "Souss Agri-Pack SARL"
  total_categories: 8
  total_events: 49
  status: "ACTIVE"

events:
  # ============================================================================
  # 1. ORDER-TO-CASH & COMMERCIAL SALES (EVT-SAL-xxx)
  # ============================================================================
  - event_id: "EVT-SAL-001"
    event_code: "SAL_ORDER_CONFIRMATION"
    event_name: "Sales Order Confirmation"
    operational_cycle: "ORDER_TO_CASH"
    trigger_type: "TRANSACTIONAL"
    primary_document: "Bon de Commande (BC Client)"
    description: "Réception et confirmation de la commande client avec vérification de l'encours de crédit autorisé."
    preconditions:
      - "Client account is active in dim_clients"
      - "Outstanding receivables + order amount <= client credit limit"
    postconditions:
      - "Order status set to CONFIRMED"
      - "Production scheduling reservation queued"
    parameters:
      required_fields: ["client_id", "order_reference", "order_date", "items", "total_ht_mad"]

  - event_id: "EVT-SAL-002"
    event_code: "SAL_GOODS_DISPATCH"
    event_name: "Finished Goods Dispatch & Delivery"
    operational_cycle: "ORDER_TO_CASH"
    trigger_type: "TRANSACTIONAL"
    primary_document: "Bon de Livraison (BL)"
    description: "Expédition des caisses ou plateaux carton vers le client et signature du bon de livraison."
    preconditions:
      - "Finished goods manufactured and available in warehouse"
      - "Delivery truck loaded and BL generated"
    postconditions:
      - "Warehouse finished goods stock decreased"
      - "Delivery note signed by consignee"
    parameters:
      required_fields: ["bl_number", "client_id", "dispatch_date", "skus_delivered", "cump_cost_mad"]

  - event_id: "EVT-SAL-003"
    event_code: "SAL_DOMESTIC_INVOICE"
    event_name: "Domestic Sales Invoice (TVA 20%)"
    operational_cycle: "ORDER_TO_CASH"
    trigger_type: "TRANSACTIONAL"
    primary_document: "Facture de Vente Locale"
    description: "Émission de la facture de vente pour le marché local marocain soumise à la TVA standard de 20%."
    preconditions:
      - "Valid signed BL exists"
      - "Client ICE format valid (15 digits)"
    postconditions:
      - "Debit 34210000 (Clients ordinaires) for TTC"
      - "Credit 71211000 (Ventes de produits finis au Maroc) for HT"
      - "Credit 44550000 (État - TVA facturée) for TVA 20%"
    parameters:
      required_fields: ["invoice_number", "client_id", "invoice_date", "amount_ht", "tva_rate", "amount_tva", "amount_ttc"]

  - event_id: "EVT-SAL-004"
    event_code: "SAL_DIRECT_EXPORT_INVOICE"
    event_name: "Direct EU Export Invoice (TVA 0% Art 92)"
    operational_cycle: "ORDER_TO_CASH"
    trigger_type: "TRANSACTIONAL"
    primary_document: "Facture Export & DUM Sortie"
    description: "Facturation directe d'emballages carton à l'exportation (Union Européenne / Afrique) exonérée avec droit à déduction."
    preconditions:
      - "Customs DUM de sortie validée"
      - "Certificat EUR.1 ou déclaration d'origine établie"
    postconditions:
      - "Debit 34210000 (Clients ordinaires) for HT"
      - "Credit 71212000 (Ventes à l'exportation directe) for HT"
    parameters:
      required_fields: ["invoice_number", "client_id", "currency", "exchange_rate", "amount_ht_mad", "dum_number"]

  - event_id: "EVT-SAL-005"
    event_code: "SAL_CUSTOMER_CREDIT_NOTE"
    event_name: "Customer Credit Note (Avoir Vente)"
    operational_cycle: "ORDER_TO_CASH"
    trigger_type: "TRANSACTIONAL"
    primary_document: "Facture d'Avoir"
    description: "Émission d'un avoir client suite à retour de lots non conformes ou rabais commercial accordé."
    preconditions:
      - "Original invoice reference valid"
      - "Non-conformance report / return validated by QC"
    postconditions:
      - "Debit 71211000 (Ventes de produits finis au Maroc) for HT"
      - "Debit 44550000 (État - TVA facturée) for TVA"
      - "Credit 34210000 (Clients ordinaires) for TTC"
    parameters:
      required_fields: ["credit_note_number", "original_invoice_number", "client_id", "amount_ht", "amount_tva", "amount_ttc"]

  - event_id: "EVT-SAL-006"
    event_code: "SAL_SCRAP_WASTE_SALE"
    event_name: "Scrap & Waste Paperboard Sale"
    operational_cycle: "ORDER_TO_CASH"
    trigger_type: "TRANSACTIONAL"
    primary_document: "Facture Vente Rebuts"
    description: "Vente de balles de rognures et déchets de carton ondulé récupérés aux papeteries recycleuses (TVA 20%)."
    preconditions:
      - "Baled scrap weight ticket issued"
      - "Contracted recycler agreement active"
    postconditions:
      - "Debit 34210000 (Clients ordinaires) for TTC"
      - "Credit 71271000 (Ventes de déchets et rebuts de carton) for HT"
      - "Credit 44550000 (État - TVA facturée) for TVA 20%"
    parameters:
      required_fields: ["invoice_number", "recycler_client_id", "weight_kg", "unit_price_mad_kg", "amount_ht", "amount_tva", "amount_ttc"]

  - event_id: "EVT-SAL-007"
    event_code: "SAL_DOUBTFUL_DEBT_PROVISION"
    event_name: "Doubtful Customer Reclassification & Provision"
    operational_cycle: "ORDER_TO_CASH"
    trigger_type: "CONDITIONAL"
    primary_document: "Dossier Contentieux & Mise en Demeure"
    description: "Reclassement d'une créance client échue en douteuse et constatation d'une dotation aux provisions pour dépréciation."
    preconditions:
      - "Client unpaid overdue > 180 days after formal notice"
      - "Legal litigation file opened by company lawyer"
    postconditions:
      - "Debit 34250000 (Clients douteux) & Credit 34210000 (Clients ordinaires) for TTC"
      - "Debit 61961000 (Dotations aux provisions créances) & Credit 39420000 (Provisions dépréciation créances) for HT"
    parameters:
      required_fields: ["client_id", "invoice_number", "amount_ttc", "provision_ht", "litigation_reference"]

  # ============================================================================
  # 2. PROCURE-TO-PAY & IMPORT OPERATIONS (EVT-PUR-xxx)
  # ============================================================================
  - event_id: "EVT-PUR-001"
    event_code: "PUR_ORDER_PLACEMENT"
    event_name: "Raw Paper Order Placement"
    operational_cycle: "PROCURE_TO_PAY"
    trigger_type: "TRANSACTIONAL"
    primary_document: "Bon de Commande Achat (PO)"
    description: "Émission du bon de commande pour approvisionnement en bobines de papier kraftliner ou testliner."
    preconditions:
      - "MRP stock level <= reorder point"
      - "Supplier approved in dim_suppliers"
    postconditions:
      - "Purchase order sent to paper mill"
      - "Expected receipt date registered"
    parameters:
      required_fields: ["po_number", "supplier_id", "item_codes", "tonnage", "unit_price_mad", "total_ht_mad"]

  - event_id: "EVT-PUR-002"
    event_code: "PUR_GOODS_RECEIPT_RAW_MATERIAL"
    event_name: "Raw Material Acceptance & Stock Ingress"
    operational_cycle: "PROCURE_TO_PAY"
    trigger_type: "TRANSACTIONAL"
    primary_document: "Bon de Réception (BR)"
    description: "Réception physique des bobines de papier à l'usine d'Ait Melloul après contrôles humidité et éclatement."
    preconditions:
      - "Physical reels inspected and moisture <= 8.5%"
      - "Weighbridge weight ticket reconciled with supplier slip"
    postconditions:
      - "Debit 31110000 (Matières premières) for CUMP value"
      - "Credit 61140000 (Variation stocks matières) for CUMP value"
    parameters:
      required_fields: ["br_number", "po_number", "supplier_id", "weight_tonnes", "cump_unit_cost", "total_cump_value"]

  - event_id: "EVT-PUR-003"
    event_code: "PUR_DOMESTIC_SUPPLIER_INVOICE"
    event_name: "Domestic Paper Mill Supplier Invoice"
    operational_cycle: "PROCURE_TO_PAY"
    trigger_type: "TRANSACTIONAL"
    primary_document: "Facture Fournisseur Locale"
    description: "Enregistrement de la facture d'achat de bobines auprès d'une papeterie marocaine (TVA 20%)."
    preconditions:
      - "3-Way match verified: PO, BR, and Invoice match"
      - "Supplier ICE and IF valid"
    postconditions:
      - "Debit 61111000 (Achats papier Kraftliner/Testliner) for HT"
      - "Debit 34512000 (État - TVA récupérable charges) for TVA 20%"
      - "Credit 44110000 (Fournisseurs ordinaires) for TTC"
    parameters:
      required_fields: ["invoice_number", "supplier_id", "invoice_date", "amount_ht", "amount_tva", "amount_ttc"]

  - event_id: "EVT-PUR-004"
    event_code: "PUR_EU_IMPORT_CLEARANCE"
    event_name: "EU Paper Import Port Agadir Clearance"
    operational_cycle: "PROCURE_TO_PAY"
    trigger_type: "TRANSACTIONAL"
    primary_document: "DUM Douane & Facture Papetier UE"
    description: "Dédouanement à l'importation de bobines UE au Port d'Agadir (0% DI avec EUR.1, TPI 0.25%, TVA 20%)."
    preconditions:
      - "EUR.1 movement certificate validated by ADII"
      - "DUM liquidation receipt issued"
    postconditions:
      - "Debit 61112000 (Achats papier importé) for CIF + TPI"
      - "Debit 34512000 (État - TVA récupérable charges) for Import TVA"
      - "Credit 44110000 (Fournisseurs / Douane) for total liability"
    parameters:
      required_fields: ["dum_number", "foreign_supplier_id", "cif_mad", "tpi_mad", "import_tva_mad", "total_payable_mad"]

  - event_id: "EVT-PUR-005"
    event_code: "PUR_CUSTOMS_FORWARDER_FEES"
    event_name: "Customs Forwarder Clearance & Port Freight"
    operational_cycle: "PROCURE_TO_PAY"
    trigger_type: "TRANSACTIONAL"
    primary_document: "Facture Transitaire"
    description: "Facturation des honoraires de dédouanement et transport terrestre du Port d'Agadir à l'usine."
    preconditions:
      - "Port exit voucher issued"
      - "Forwarder service breakdown provided"
    postconditions:
      - "Debit 61421000 (Transports sur achats) for HT"
      - "Debit 34512000 (État - TVA récupérable charges) for TVA"
      - "Credit 44110000 (Fournisseurs) for TTC"
    parameters:
      required_fields: ["forwarder_invoice_number", "forwarder_id", "amount_ht", "amount_tva", "amount_ttc"]

  - event_id: "EVT-PUR-006"
    event_code: "PUR_ONEE_ELECTRICITY_INVOICE"
    event_name: "ONEE Medium Voltage Electricity Invoice"
    operational_cycle: "PROCURE_TO_PAY"
    trigger_type: "TRANSACTIONAL"
    primary_document: "Facture ONEE MT"
    description: "Facture mensuelle d'électricité moyenne tension pour l'onduleuse (TVA 18% en 2025 / 20% en 2026)."
    preconditions:
      - "Monthly meter reading verified by factory technical director"
    postconditions:
      - "Debit 61251000 (Achats non stockés - Électricité MT) for HT"
      - "Debit 34512000 (État - TVA récupérable charges) for TVA"
      - "Credit 44110000 (Fournisseurs - ONEE) for TTC"
    parameters:
      required_fields: ["onee_invoice_number", "billing_month", "kwh_consumed", "amount_ht", "tva_rate", "amount_tva", "amount_ttc"]

  - event_id: "EVT-PUR-007"
    event_code: "PUR_CONSUMABLES_GLUE_INVOICE"
    event_name: "Consumables, Starch Glue & Inks Invoice"
    operational_cycle: "PROCURE_TO_PAY"
    trigger_type: "TRANSACTIONAL"
    primary_document: "Facture Fournisseur Chimique"
    description: "Achat d'amidon industriel, colles d'ondulation, encres flexo et fil d'agrafage (TVA 20%)."
    preconditions:
      - "Chemicals delivered and quality certificate approved"
    postconditions:
      - "Debit 61211000 (Achats d'amidon et colles) for HT"
      - "Debit 34512000 (État - TVA récupérable charges) for TVA 20%"
      - "Credit 44110000 (Fournisseurs) for TTC"
    parameters:
      required_fields: ["invoice_number", "supplier_id", "amount_ht", "amount_tva", "amount_ttc"]

  # ============================================================================
  # 3. PAYROLL & SOCIAL CHARGES (EVT-PAY-xxx)
  # ============================================================================
  - event_id: "EVT-PAY-001"
    event_code: "PAY_GROSS_PAYROLL_ACCRUAL"
    event_name: "Monthly Gross Payroll Accrual"
    operational_cycle: "PAYROLL_SOCIAL"
    trigger_type: "SCHEDULED"
    primary_document: "Livre de Paie Mensuel"
    description: "Constatation des rémunérations brutes du personnel permanent (22) et saisonniers (5 SMIG)."
    preconditions:
      - "Timecards and attendance sheets validated by production manager"
    postconditions:
      - "Debit 61711000 (Rémunérations personnel permanent) for permanent gross"
      - "Debit 61712000 (Rémunérations ouvriers saisonniers) for seasonal gross"
      - "Credit 44320000 (Rémunérations dues au personnel) for total gross"
    parameters:
      required_fields: ["payroll_period", "gross_permanent", "gross_seasonal", "total_gross"]

  - event_id: "EVT-PAY-002"
    event_code: "PAY_EMPLOYEE_DEDUCTIONS"
    event_name: "Employee Salary Deductions (CNSS 6.74% & IR)"
    operational_cycle: "PAYROLL_SOCIAL"
    trigger_type: "SCHEDULED"
    primary_document: "Bordereau Récapitulatif de Paie"
    description: "Comptabilisation des retenues salariales à la source au titre de la CNSS (6.74%) et de l'IR (Barème LF 2025)."
    preconditions:
      - "Gross payroll accrued in EVT-PAY-001"
    postconditions:
      - "Debit 44320000 (Rémunérations dues au personnel) for total deductions"
      - "Credit 44410000 (CNSS) for employee CNSS + AMO"
      - "Credit 44571000 (État - Retenues à la source IR) for withheld IR"
    parameters:
      required_fields: ["payroll_period", "cnss_employee_total", "ir_withheld_total", "total_deductions"]

  - event_id: "EVT-PAY-003"
    event_code: "PAY_EMPLOYER_SOCIAL_ACCRUAL"
    event_name: "Employer Social Security & AT Insurance Accrual"
    operational_cycle: "PAYROLL_SOCIAL"
    trigger_type: "SCHEDULED"
    primary_document: "Bordereau Cotisations CNSS & Quittance AT"
    description: "Comptabilisation des charges patronales CNSS (21.09%) et de l'assurance Accidents du Travail (3.80%)."
    preconditions:
      - "Gross payroll accrued in EVT-PAY-001"
    postconditions:
      - "Debit 61741000 (CNSS Prestations & AF) for employer prestations"
      - "Debit 61742000 (AMO & Formation pro) for employer AMO & OFPPT"
      - "Debit 61761000 (Assurance AT 3.80%) for AT premium"
      - "Credit 44410000 (CNSS) for total employer CNSS"
      - "Credit 44450000 (Assurances AT) for AT insurer liability"
    parameters:
      required_fields: ["payroll_period", "cnss_employer_prestations", "cnss_employer_amo_fp", "at_insurance_cost"]

  - event_id: "EVT-PAY-004"
    event_code: "PAY_NET_SALARY_BANK_TRANSFER"
    event_name: "Net Salary Bank Wire Transfer"
    operational_cycle: "PAYROLL_SOCIAL"
    trigger_type: "SCHEDULED"
    primary_document: "Ordre de Virement Bancaire AWB"
    description: "Virement bancaire collectif des salaires nets sur les comptes des collaborateurs le 28 du mois."
    preconditions:
      - "Payroll calculated and bank account balance sufficient"
    postconditions:
      - "Debit 44320000 (Rémunérations dues au personnel) for net wages"
      - "Credit 51411000 (Banque Attijariwafa bank) for net wages"
    parameters:
      required_fields: ["transfer_date", "payroll_period", "net_salaries_payable", "bank_reference"]

  - event_id: "EVT-PAY-005"
    event_code: "PAY_CNSS_TELEPAYMENT"
    event_name: "CNSS Damancom Tele-Payment"
    operational_cycle: "PAYROLL_SOCIAL"
    trigger_type: "SCHEDULED"
    primary_document: "Bordereau de Télé-règlement Damancom"
    description: "Règlement mensuel par télépaiement bancaire des cotisations patronales et salariales CNSS au plus tard le 10 du mois M+1."
    preconditions:
      - "Damancom declaration submitted and validated"
    postconditions:
      - "Debit 44410000 (CNSS) for total liability"
      - "Credit 51411000 (Banque Attijariwafa bank) for total liability"
    parameters:
      required_fields: ["payment_date", "payroll_period", "total_cnss_due", "damancom_receipt"]

  - event_id: "EVT-PAY-006"
    event_code: "PAY_SIMPL_IR_TELEPAYMENT"
    event_name: "SIMPL-IR Monthly Tele-Payment"
    operational_cycle: "PAYROLL_SOCIAL"
    trigger_type: "SCHEDULED"
    primary_document: "Quittance de Paiement SIMPL-IR"
    description: "Paiement en ligne sur le portail SIMPL-IR de la retenue à la source sur salaires au plus tard le dernier jour du mois M+1."
    preconditions:
      - "SIMPL-IR monthly return filed on DGI portal"
    postconditions:
      - "Debit 44571000 (État - Retenues IR sur salaires) for IR due"
      - "Credit 51411000 (Banque Attijariwafa bank) for IR due"
    parameters:
      required_fields: ["payment_date", "tax_period", "ir_withheld_total", "simpl_receipt_number"]

  # ============================================================================
  # 4. BANKING, TREASURY & CREDIT FACILITIES (EVT-BNK-xxx)
  # ============================================================================
  - event_id: "EVT-BNK-001"
    event_code: "BNK_LCN_RECEIPT"
    event_name: "Customer Commercial Bill (LCN) Receipt"
    operational_cycle: "BANKING_TREASURY"
    trigger_type: "TRANSACTIONAL"
    primary_document: "Lettre de Change Normalisée (LCN)"
    description: "Réception de la traite LCN acceptée par le client en règlement d'une facture à échéance 60-90 jours."
    preconditions:
      - "Valid invoice outstanding"
      - "LCN signed and format valid with 24-digit RIB"
    postconditions:
      - "Debit 34240000 (Clients - effets à recevoir) for nominal"
      - "Credit 34210000 (Clients ordinaires) for nominal"
    parameters:
      required_fields: ["lcn_reference", "client_id", "nominal_amount", "due_date", "drawee_bank_rib"]

  - event_id: "EVT-BNK-002"
    event_code: "BNK_LCN_DISCOUNT_REMITTANCE"
    event_name: "LCN Commercial Bill Discount Remittance"
    operational_cycle: "BANKING_TREASURY"
    trigger_type: "TRANSACTIONAL"
    primary_document: "Bordereau de Remise à l'Escompte"
    description: "Remise physique et électronique d'effets de commerce à l'escompte auprès d'Attijariwafa bank."
    preconditions:
      - "LCN held in portfolio (Account 34240000)"
      - "AWB escompte ceiling (1.5M MAD) not exceeded"
    postconditions:
      - "Debit 51150000 (Effets remis à l'escompte) for nominal"
      - "Credit 34240000 (Clients - effets à recevoir) for nominal"
    parameters:
      required_fields: ["remittance_slip_number", "bills_count", "lcn_nominal", "bank_code"]

  - event_id: "EVT-BNK-003"
    event_code: "BNK_DISCOUNT_ADVICE_CREDIT"
    event_name: "Discount Advice & Agios Deduction"
    operational_cycle: "BANKING_TREASURY"
    trigger_type: "TRANSACTIONAL"
    primary_document: "Avis de Crédit Escompte AWB"
    description: "Crédit en compte du produit net de l'escompte après déduction des intérêts, commissions et TVA 10% sur agios."
    preconditions:
      - "Remittance processed by bank discount department"
    postconditions:
      - "Debit 51411000 (Banque AWB) for net credited amount"
      - "Debit 63181000 (Intérêts et agios escompte) for discount interest + fees"
      - "Debit 34512000 (État - TVA récupérable charges) for 10% VAT on fees"
      - "Credit 55200000 (Crédits d'escompte) for total nominal"
    parameters:
      required_fields: ["advice_number", "lcn_nominal", "discount_interest_ht", "banking_fees_ht", "agio_tva_10", "total_agio_ttc"]

  - event_id: "EVT-BNK-004"
    event_code: "BNK_LCN_MATURITY_EXTINCTION"
    event_name: "LCN Normal Maturity Extinction"
    operational_cycle: "BANKING_TREASURY"
    trigger_type: "SCHEDULED"
    primary_document: "Avis de Dénouement Bancaire"
    description: "Extinction de la dette d'escompte à bonne date d'échéance suite au paiement effectif par le tiré."
    preconditions:
      - "Maturity date reached and bill honored by drawee bank"
    postconditions:
      - "Debit 55200000 (Crédits d'escompte) for nominal"
      - "Credit 51150000 (Effets remis à l'escompte) for nominal"
    parameters:
      required_fields: ["lcn_reference", "maturity_date", "lcn_nominal"]

  - event_id: "EVT-BNK-005"
    event_code: "BNK_LCN_UNPAID_PROTEST"
    event_name: "LCN Unpaid Bill Protest & Bank Debit"
    operational_cycle: "BANKING_TREASURY"
    trigger_type: "CONDITIONAL"
    primary_document: "Avis d'Impayé Bancaire & Frais de Rejet"
    description: "Rejet d'une LCN escomptée pour défaut de provision du client et débit du compte bancaire avec frais de rejet."
    preconditions:
      - "Drawee bank returns unpaid notification"
    postconditions:
      - "Debit 34210000 (Clients ordinaires) for nominal"
      - "Debit 61471000 (Services bancaires - Frais de rejet) for fees HT"
      - "Debit 34512000 (État - TVA récupérable charges) for 10% VAT on fees"
      - "Credit 51411000 (Banque AWB) for nominal + fees TTC"
    parameters:
      required_fields: ["lcn_reference", "client_id", "lcn_nominal", "reject_fee_ht", "reject_fee_tva"]

  - event_id: "EVT-BNK-006"
    event_code: "BNK_SUPPLIER_WIRE_TRANSFER"
    event_name: "Supplier Bank Wire Settlement"
    operational_cycle: "BANKING_TREASURY"
    trigger_type: "TRANSACTIONAL"
    primary_document: "Ordre de Virement Fournisseur"
    description: "Règlement d'une facture fournisseur par virement bancaire sur compte courant AWB."
    preconditions:
      - "Approved supplier invoice due for payment"
      - "Available cash balance or authorized overdraft room"
    postconditions:
      - "Debit 44110000 (Fournisseurs ordinaires) for payment amount"
      - "Credit 51411000 (Banque Attijariwafa bank) for payment amount"
    parameters:
      required_fields: ["transfer_reference", "supplier_id", "invoice_reference", "payment_amount"]

  - event_id: "EVT-BNK-007"
    event_code: "BNK_CAMPAIGN_CREDIT_DRAWDOWN"
    event_name: "Agricultural Campaign Credit Drawdown (CAM)"
    operational_cycle: "BANKING_TREASURY"
    trigger_type: "TRANSACTIONAL"
    primary_document: "Contrat de Prêt Campagne CAM"
    description: "Déblocage de la ligne de crédit de campagne agricole auprès du Crédit Agricole du Maroc (400 000 MAD) pour financer le BFR."
    preconditions:
      - "High season agricultural window active (September to March)"
      - "CAM credit line ceiling not exceeded"
    postconditions:
      - "Debit 51413000 (Banque CAM) for principal"
      - "Credit 55410000 (Crédits de campagne agricole) for principal"
    parameters:
      required_fields: ["loan_contract_number", "drawdown_date", "loan_principal", "interest_rate"]

  - event_id: "EVT-BNK-008"
    event_code: "BNK_CAMPAIGN_CREDIT_REPAYMENT"
    event_name: "Agricultural Campaign Credit Repayment (CAM)"
    operational_cycle: "BANKING_TREASURY"
    trigger_type: "SCHEDULED"
    primary_document: "Avis de Débit Remboursement CAM"
    description: "Remboursement intégral du crédit de campagne agricole et des intérêts échus en fin de saison maraîchère (Mars)."
    preconditions:
      - "Campaign loan maturity reached"
      - "Sufficient cash collections from citrus/tomato exporters"
    postconditions:
      - "Debit 55410000 (Crédits de campagne agricole) for principal"
